model:
  arch: blip2_t5_instruct_nav
  model_type: flant5xl
  load_finetuned: False
  use_grad_checkpoint: True
  freeze_vit: True

datasets:
  r2r_navgpt: # keep existing builder; expects NavGPT-style annotations
    vis_processor:
        train:
          name: "blip_image_eval"
          image_size: 224
        eval:
          name: "blip_image_eval"
          image_size: 224
    text_processor:
        train:
          name: "blip_navgpt_prompt"
          prompt: "You are navigating in an indoor environment given the instruction: {instruction}; The navigable locations are listed below: {candidate}; Please choose the next direction."
        eval:
          name: "blip_navgpt_prompt"
          prompt: "You are navigating in an indoor environment given the instruction: {instruction}; The navigable locations are listed below: {candidate}; Please choose the next direction."
    build_info:
      annotations:
        # NOTE: these files must be NavGPT-style samples with keys like
        # sample_id, scan, viewpoint, candidate, instruction, llm_thought.
        train:
          url: datasets/REVERIE/NavGPT-Instruct/REVERIE_NavGPT_train_v1.json
          storage: datasets/REVERIE/NavGPT-Instruct/REVERIE_NavGPT_train_v1.json
        val:
          url: datasets/REVERIE/NavGPT-Instruct/REVERIE_NavGPT_val_v1.json
          storage: datasets/REVERIE/NavGPT-Instruct/REVERIE_NavGPT_val_v1.json
      features:
        storage: datasets/R2R/features/MP3D_eva_clip_g_can.lmdb

run:
  task: r2r_captioning
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 20
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 4
  accum_grad_iters: 8

  max_len: 1024
  min_len: 8
  num_beams: 5

  seed: 42
  output_dir: "output/NavGPT-InstructBLIP-FlanT5xl-REVERIE/"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]

  device: "cuda"
  # Set world_size to the number of GPUs (must match --nproc_per_node in train_REVERIE_xl.sh)
  world_size: 1
  dist_url: "env://"
  distributed: True
